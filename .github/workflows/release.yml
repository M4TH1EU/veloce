name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check and build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.VELOCE_KEYSTORE_BASE64 }}
          VELOCE_STORE_FILE: ${{ runner.temp }}/veloce-release.jks
          VELOCE_STORE_PASSWORD: ${{ secrets.VELOCE_STORE_PASSWORD }}
          VELOCE_KEY_ALIAS: ${{ secrets.VELOCE_KEY_ALIAS }}
          VELOCE_KEY_PASSWORD: ${{ secrets.VELOCE_KEY_PASSWORD }}
        run: |
          : "${VELOCE_STORE_PASSWORD:?Missing VELOCE_STORE_PASSWORD}"
          : "${VELOCE_KEY_ALIAS:?Missing VELOCE_KEY_ALIAS}"
          : "${VELOCE_KEY_PASSWORD:?Missing VELOCE_KEY_PASSWORD}"
          umask 077
          printf '%s' "${KEYSTORE_BASE64:?Missing VELOCE_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/veloce-release.jks"
          ./gradlew :protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/veloce-release.jks"
      - name: Verify signed APK
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk --clobber
